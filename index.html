<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#126b58"><title>フィラメント管理・新窓口</title>
<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="icon" href="./favicon.ico">
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f4;color:#18332f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}.wrap{max-width:540px;padding:18px 14px 36px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 12px}.muted{color:#546961;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}button,input,select{font:inherit;font-size:16px;min-height:48px;border-radius:10px;border:1px solid #b8cbc4;padding:10px 12px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #64aaf5;outline-offset:3px}input,select{width:100%;min-width:0}.primary{background:#126b58;color:white;border-color:#126b58}.full{width:100%}.scan{min-height:64px;font-size:19px;font-weight:650}.panel{padding:16px;background:white;border-radius:16px;margin-top:14px}.status{white-space:pre-wrap;font-size:14px;line-height:1.6;margin:12px 0;overflow-wrap:anywhere}.error{color:#a12525}.success{color:#126b58}.hidden,[hidden]{display:none!important}.number{font-size:28px;font-weight:650}.id{font-size:20px;font-weight:650;overflow-wrap:anywhere}.kind{margin:12px 0}.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}label.field{display:block;margin:12px 0 6px}.place{border-top:1px solid #e0e8e4;margin-top:16px;padding-top:14px}.small-button{font-size:14px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.checks label{display:flex;align-items:center;gap:6px;min-height:44px;font-size:14px}.checks input{width:20px;height:20px;min-height:0;accent-color:#126b58}.total{background:#e9f5ef;padding:12px;border-radius:10px;margin:10px 0}.stockrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,.7fr);gap:6px;padding:10px 0;border-bottom:1px solid #e0e8e4;font-size:14px;overflow-wrap:anywhere}.stockrow span:last-child{text-align:right}.stockhead{font-size:12px;color:#546961}.result{border-top:1px solid #e0e8e4;padding:12px 0;line-height:1.6;font-size:14px}summary{min-height:48px;padding:12px 0;cursor:pointer;font-weight:600}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1}.note{background:#fff4dc;padding:12px;border-radius:10px;font-size:14px;line-height:1.6}#camera{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column}video{width:100%;height:100%;object-fit:cover}#cameraHint{position:absolute;top:max(16px,env(safe-area-inset-top));left:14px;right:14px;color:white;background:#0009;padding:12px;border-radius:10px}#cameraClose{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:14px;right:14px}#scanFrame{position:absolute;width:min(72vw,320px);aspect-ratio:1;top:50%;left:50%;transform:translate(-50%,-50%);border:3px solid white;border-radius:18px;box-shadow:0 0 0 9999px #0003;pointer-events:none}fieldset{border:0;margin:0;padding:0;min-width:0}.gap{margin-top:12px}
</style>
</head>
<body>
<main class="wrap" id="main">
<header><h1>フィラメント管理</h1><span class="muted">新窓口</span></header>
<button id="scan" class="primary full scan" type="button">QR読み取り・カメラ起動</button>
<p id="status" class="status" role="status" aria-live="polite">在庫データを取得しています…</p>
<section id="itemPanel" class="panel" hidden aria-label="読み取ったフィラメント">
<div class="row"><div><div class="muted">管理番号</div><div id="itemId" class="id"></div></div><div><div class="muted">現在重量</div><div class="number"><span id="itemWeight"></span> <small>g</small></div></div></div>
<div id="itemKind" class="kind"></div><div class="muted">前回の担当：<span id="lastPerson"></span></div>
<fieldset id="editFields">
<label class="field" for="person">今回の担当</label><select id="person"><option value="">選択してください</option><option value="__new__">新しい名前を入力</option></select>
<div id="customPersonBox" hidden><label class="field" for="customPerson">担当者名</label><input id="customPerson" autocomplete="name" maxlength="80"></div>
<form id="weightForm"><label class="field" for="weight">計測した重量（g）</label><div class="entry"><input id="weight" type="number" min="0" max="5000" step="any" inputmode="decimal" required placeholder="重量を入力"><button type="submit" class="primary">重量を更新</button></div></form>
<div class="row place"><span>現在の保管場所：<strong id="itemLocation"></strong></span><button id="locationToggle" class="small-button" type="button" aria-expanded="false" aria-controls="locationForm">場所を変更</button></div>
<form id="locationForm" hidden><p class="muted">保管場所を変えても管理番号とQRは変わりません。</p><label class="field" for="newLocation">変更先</label><select id="newLocation"><option>さんらいず</option><option>オーシャン</option><option>フォージー</option></select><button class="full gap" type="submit">この場所に変更</button></form>
</fieldset>
<p id="saveStatus" class="status" role="status" aria-live="polite"></p>
<div id="uncertain" class="note" hidden>前回の更新結果を確認できていません。重複更新を避けるため、この物品の更新を停止しています。「データを再取得」で現在値を確認し、フォームの回答 1も確認してください。<button id="acknowledge" type="button" class="full gap">フォームの回答 1を確認済み・更新を再開</button></div>
</section>
<section id="stockPanel" class="panel" hidden><h2>同じ種類の在庫</h2><div id="stockKind" class="muted"></div><div class="checks" id="stockFilters"><label><input type="checkbox" value="ALL">ALL（全場所）</label><label><input type="checkbox" value="さんらいず">さんらいず</label><label><input type="checkbox" value="オーシャン">オーシャン</label><label><input type="checkbox" value="フォージー">フォージー</label></div><div class="total"><div class="row"><span>重量合計</span><strong id="stockTotal"></strong></div><div id="stockNote" class="muted"></div></div><div class="muted">ほかの在庫（重量があるもの）</div><div class="stockrow stockhead"><span>管理番号</span><span>保管場所</span><span>重量</span></div><div id="stockRows"></div></section>
<section class="panel"><details id="searchDetails"><summary>別のフィラメントを探す</summary><form id="searchForm"><label class="field" for="maker">1. メーカー</label><select id="maker" disabled></select><label class="field" for="base">2. 素材</label><select id="base" disabled></select><label class="field" for="color">3. 色</label><select id="color" disabled></select><label class="field" for="searchLocation">保管場所</label><select id="searchLocation"><option value="ALL">ALL（全場所）</option><option>さんらいず</option><option>オーシャン</option><option>フォージー</option></select><button id="searchButton" type="submit" class="primary full gap" disabled>在庫を表示</button></form><div id="searchResults" class="gap" aria-live="polite"></div></details></section>
<button id="refresh" type="button" class="full gap">データを再取得</button><p id="listStatus" class="muted status" aria-live="polite"></p>
</main>
<div id="camera" hidden><video id="video" playsinline muted></video><div id="scanFrame"></div><div id="cameraHint">QRを枠に合わせてください。認識すると自動で戻ります。</div><button id="cameraClose" type="button">カメラを閉じる</button><canvas id="canvas" hidden></canvas></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
'use strict';
const GAS_API_URL='https://script.google.com/macros/s/AKfycbzCCejDFlAfJV5sjxhzH7wp1-4S7oVK6s0Gru_m4QXVmSRdnnOXDcCfqeogW5GA4PFR/exec';
const CSV_URL='https://docs.google.com/spreadsheets/d/15UGqdqOwVQNx9qY02HtZIaqrD6Kd1dwmWuj4p3EGIGg/export?format=csv&gid=93776902';
const $=id=>document.getElementById(id), locations=['さんらいず','オーシャン','フォージー'];
const text=v=>String(v??'').trim(), norm=v=>text(v).replace(/\s+/g,' '), format=v=>Number(v).toLocaleString('ja-JP',{maximumFractionDigits:3});
let rows=[],current=null,listReady=false,busy=false,listBusy=false,searchShown=false,stream=null,timer=null,cameraEpoch=0;
const overrides=new Map();
function stored(key,fallback){try{return JSON.parse(sessionStorage.getItem(key))??fallback}catch{return fallback}}
function store(key,value){try{sessionStorage.setItem(key,JSON.stringify(value))}catch{}}
const pending=stored('filamentPendingV1',{});
let chosenPerson=stored('filamentPersonV1','');
function message(id,value,error=false){$(id).textContent=value;$(id).classList.toggle('error',error)}
function controls(){ $('scan').disabled=busy||listBusy; $('refresh').disabled=busy||listBusy; $('editFields').disabled=busy||listBusy||!current||Boolean(pending[current.id]); $('uncertain').hidden=!current||!pending[current.id]; $('acknowledge').disabled=busy||listBusy; }
function options(id,values,placeholder){const select=$(id);select.replaceChildren(new Option(placeholder,''));[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')).forEach(v=>select.add(new Option(v,v)))}
function people(){const name=chosenPerson;options('person',[...rows.map(r=>r.person),current?.person,name],'選択してください');$('person').add(new Option('新しい名前を入力','__new__'));$('person').value=name;$('customPersonBox').hidden=true}
function getPerson(){const value=$('person').value==='__new__'?text($('customPerson').value):text($('person').value);if(!value){$('person').focus();throw Error('今回の担当者を選択または入力してください。')}return value}
function rememberPerson(){chosenPerson=$('person').value==='__new__'?text($('customPerson').value):$('person').value;store('filamentPersonV1',chosenPerson)}
$('person').onchange=()=>{$('customPersonBox').hidden=$('person').value!=='__new__';rememberPerson()};$('customPerson').oninput=rememberPerson;
function parseId(value){try{const url=new URL(value);return text(url.searchParams.get('entry.268306040')||url.searchParams.get('id'))}catch{return /^[SOF]\d{8}$/.test(text(value))?text(value):''}}
async function request(url,options={}){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),45000);try{const response=await fetch(url,{...options,signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error('通信エラー（HTTP '+response.status+'）');const body=await response.text();let data;try{data=JSON.parse(body)}catch{throw Error('GASの応答を読めません。Webアプリの公開設定を確認してください。')}if(!data||typeof data.ok!=='boolean')throw Error('GASの応答形式が一致しません。');return data}finally{clearTimeout(timeout)}}
function apiItem(data){if(!data.ok||!text(data.id))throw Error(data.error==='ID_NOT_FOUND'?'この管理番号は台帳にありません。':(data.message||data.error||'情報を取得できません。'));const weight=data.weight===''||data.weight==null?null:Number(data.weight);if(weight!==null&&!Number.isFinite(weight))throw Error('台帳の重量を確認してください。');return {...data,id:text(data.id),weight,maker:norm(data.maker),base:norm(data.base),color:norm(data.color),location:norm(data.location),person:norm(data.person)}}
function merge(item){const index=rows.findIndex(r=>r.id===item.id);if(index<0)rows.push(item);else rows[index]=item;overrides.set(item.id,item)}
async function lookup(id){const url=new URL(GAS_API_URL);url.searchParams.set('id',id);return apiItem(await request(url))}
async function selectItem(id,filters=null){if(busy)return;busy=true;current=null;$('itemPanel').hidden=true;$('stockPanel').hidden=true;controls();message('status','管理番号 '+id+' の最新情報を取得しています…');try{const item=await lookup(id);if(item.id!==id)throw Error('取得した管理番号が一致しません。');current=item;merge(item);$('weight').value='';$('locationForm').hidden=true;$('locationToggle').setAttribute('aria-expanded','false');setFilters(filters||[locations.includes(item.location)?item.location:'ALL']);render();people();store('filamentLastV1',{id,filters:selectedFilters()});message('saveStatus','');message('status','読み取りました。重量を入力して更新できます。');$('scan').textContent='次のQRを読み取る'}catch(error){message('status',error.message,true)}finally{busy=false;controls()}}
function render(){if(!current)return;$('itemPanel').hidden=false;$('itemId').textContent=current.id;$('itemWeight').textContent=current.weight==null?'未設定':format(current.weight);$('itemKind').textContent=[current.maker,current.base,current.color].join(' ／ ');$('itemLocation').textContent=current.location||'未設定';$('lastPerson').textContent=current.person||'未設定';renderStock();if(searchShown)search()}
const filters=[...$('stockFilters').querySelectorAll('input')];
function selectedFilters(){return filters.filter(i=>i.checked).map(i=>i.value)}
function setFilters(values){filters.forEach(i=>i.checked=values.includes(i.value));if(!filters.some(i=>i.checked))filters[0].checked=true}
filters.forEach(input=>input.onchange=()=>{if(input.checked)filters.forEach(other=>{if((input.value==='ALL'&&input!==other)||(input.value!=='ALL'&&other.value==='ALL'))other.checked=false});if(!filters.some(i=>i.checked))filters[0].checked=true;renderStock();if(current)store('filamentLastV1',{id:current.id,filters:selectedFilters()})});
function stockRow(item){const line=document.createElement('div');line.className='stockrow';[item.id,item.location||'未設定',format(item.weight)+' g'].forEach(v=>{const span=document.createElement('span');span.textContent=v;line.append(span)});return line}
function renderStock(){if(!current||!listReady){$('stockPanel').hidden=true;return}$('stockPanel').hidden=false;$('stockKind').textContent=[current.maker,current.base,current.color].join(' ／ ');const selected=selectedFilters(),inPlace=r=>selected.includes('ALL')||selected.includes(r.location);const others=rows.filter(r=>r.id!==current.id&&r.maker===current.maker&&r.base===current.base&&r.color===current.color&&inPlace(r)&&r.weight>0);$('stockRows').replaceChildren(...others.map(stockRow));if(!others.length)$('stockRows').textContent='該当するほかの在庫はありません。';$('stockTotal').textContent=format(others.reduce((s,r)=>s+r.weight,inPlace(current)?(current.weight||0):0))+' g';$('stockNote').textContent=inPlace(current)?'表示中の '+current.id+' を含む':'表示中の物品は選択場所外のため含まない'}
function field(row,names){for(const key of names)if(row[key]!=null&&text(row[key])!=='')return row[key];return ''}
function csvItem(row){const raw=field(row,['重量（ｇ）','重量（g）','重量(g)','重量（G）','重量']);const numeric=Number(text(raw).replace(/,/g,''));return {id:text(field(row,['管理番号(半角)','管理番号（半角）','管理番号'])),maker:norm(row['メーカー']),base:norm(field(row,['母材(ベース)','母材（ベース）','母材'])),sub:norm(row['サブカテゴリ']),color:norm(row['色']),location:norm(row['保管場所']),weight:raw===''||!Number.isFinite(numeric)?null:numeric,person:norm(row['担当']),note:text(row['備考'])}}
async function loadList(){if(typeof Papa==='undefined')throw Error('在庫読込ライブラリを取得できません。ページを再読込してください。');const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),30000);try{const res=await fetch(CSV_URL,{cache:'no-store',signal:controller.signal});if(!res.ok)throw Error('在庫一覧の取得に失敗しました。');const data=Papa.parse(await res.text(),{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()});if(data.errors.length)throw Error('在庫一覧の形式を読み取れません。');if(!data.meta.fields?.some(k=>['管理番号(半角)','管理番号（半角）','管理番号'].includes(k)))throw Error('在庫一覧を取得できません。共有設定を確認してください。');rows=data.data.map(csvItem).filter(r=>r.id);overrides.forEach((item,id)=>{const i=rows.findIndex(r=>r.id===id);if(i>=0&&rows[i].weight===item.weight&&rows[i].location===item.location&&rows[i].person===item.person)overrides.delete(id);else if(i>=0)rows[i]=item;else rows.push(item)});listReady=true;initSearch();people();renderStock();message('listStatus','在庫一覧の取得：'+new Date().toLocaleTimeString('ja-JP')+'（選択中の物品はGASから取得）')}finally{clearTimeout(timeout)}}
function initSearch(){options('maker',rows.map(r=>r.maker),'メーカーを選択');$('maker').disabled=false;options('base',[],'メーカーを先に選択');options('color',[],'素材を先に選択');$('base').disabled=$('color').disabled=$('searchButton').disabled=true;clearSearch()}
function clearSearch(){searchShown=false;$('searchResults').replaceChildren()}
$('maker').onchange=()=>{options('base',rows.filter(r=>r.maker===$('maker').value).map(r=>r.base),'素材を選択');$('base').disabled=!$('maker').value;options('color',[],'素材を先に選択');$('color').disabled=$('searchButton').disabled=true;clearSearch()};
$('base').onchange=()=>{options('color',rows.filter(r=>r.maker===$('maker').value&&r.base===$('base').value).map(r=>r.color),'色を選択');$('color').disabled=!$('base').value;$('searchButton').disabled=true;clearSearch()};$('color').onchange=()=>{$('searchButton').disabled=!$('color').value;clearSearch()};$('searchLocation').onchange=clearSearch;
function search(){const found=rows.filter(r=>r.maker===$('maker').value&&r.base===$('base').value&&r.color===$('color').value&&r.weight>0&&($('searchLocation').value==='ALL'||r.location===$('searchLocation').value));const out=$('searchResults');out.replaceChildren();const count=document.createElement('p');count.textContent='検索結果：'+found.length+'本';out.append(count);const groups=[...new Set(found.map(r=>r.location))];if(groups.length>1)groups.forEach(location=>{const items=found.filter(r=>r.location===location),p=document.createElement('p');p.textContent=(location||'未設定')+'：'+items.length+'本 ／ '+format(items.reduce((n,r)=>n+r.weight,0))+' g';out.append(p)});if(!found.length){out.append(document.createTextNode('条件に一致する在庫はありません。'));return}found.forEach(item=>{const div=document.createElement('div');div.className='result';const name=document.createElement('strong');name.textContent=item.id;const detail=document.createElement('div');detail.textContent=[item.maker,item.base,item.color,item.location,format(item.weight)+' g'].join(' ／ ');div.append(name,detail);out.append(div)})}
$('searchForm').onsubmit=e=>{e.preventDefault();searchShown=true;search()};
async function verifyApi(){const url=new URL(GAS_API_URL);url.searchParams.set('action','health');const info=await request(url);if(!info.ok||info.apiVersion!=='filament-form-history-v3'||info.historySheet!=='フォームの回答 1')throw Error('公開中のGASが新窓口の履歴対応版ではありません。GASの「デプロイを管理」でバージョンを更新してください。在庫更新は送信していません。');}
function pendingMessage(value){return value==='UPDATE_REQUIRES_REVIEW'?'台帳更新またはログ記録の途中で問題が発生しました。フォームの回答 1と現在値を確認してください。':'通信結果を確認できませんでした。更新済みの可能性があるため、自動再送はしていません。'}
async function save(action){if(busy||listBusy||!current||pending[current.id])return;let payload;try{const person=getPerson();payload={action,id:current.id,person};if(action==='updateWeight'){const value=$('weight').valueAsNumber;if(!Number.isFinite(value)||value<0||value>5000)throw Error('重量は0〜5000gで入力してください。');payload.weight=value}else{payload.location=$('newLocation').value;if(payload.location===current.location)throw Error('現在と異なる保管場所を選んでください。')}}catch(error){message('saveStatus',error.message,true);return}
busy=true;controls();message('saveStatus','接続先の履歴対応を確認しています…');try{await verifyApi()}catch(error){message('saveStatus',error.message,true);busy=false;controls();return}pending[current.id]={action,at:new Date().toISOString()};store('filamentPendingV1',pending);controls();message('saveStatus','保存しています…');let confirmed=false;
try{const result=await request(GAS_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)});if(!result.ok){if(result.error!=='UPDATE_REQUIRES_REVIEW'){delete pending[payload.id];store('filamentPendingV1',pending);throw Error(result.message||result.error||'更新できませんでした。')}throw Error(pendingMessage(result.error)+'\n処理ID：'+(result.operationId||'不明'))}if(result.id!==payload.id||result.action!==action||result.weight==null||result.weight===''||!Number.isFinite(Number(result.weight))||!text(result.person)||!text(result.operationId)||result.apiVersion!=='filament-form-history-v3'||result.historyStatus!=='完了'||result.historySheet!=='フォームの回答 1')throw Error('更新は反映されている可能性がありますが、履歴保存の返答が一致しません。GAS内の同名関数の重複と「フォームの回答 1」を確認してください。再送はしていません。');confirmed=true;delete pending[payload.id];store('filamentPendingV1',pending);current={...current,weight:Number(result.weight),location:result.location,person:result.person};merge(current);chosenPerson=payload.person;store('filamentPersonV1',chosenPerson);people();render();$('weight').value='';$('locationForm').hidden=true;$('locationToggle').setAttribute('aria-expanded','false');message('saveStatus',(action==='updateWeight'?'重量':'保管場所')+'を更新し、フォームの回答 1に記録しました。');
}catch(error){message('saveStatus',pending[payload.id]?(error.message.includes('フォームの回答 1')?error.message:pendingMessage('')):error.message,true)}finally{busy=false;controls();if(confirmed)$('weight').blur()}}
$('weightForm').onsubmit=e=>{e.preventDefault();if($('weightForm').reportValidity())save('updateWeight')};$('locationForm').onsubmit=e=>{e.preventDefault();save('updateLocation')};$('locationToggle').onclick=()=>{const show=$('locationForm').hidden;$('locationForm').hidden=!show;$('locationToggle').setAttribute('aria-expanded',String(show));$('newLocation').value=current.location};
$('acknowledge').onclick=()=>{if(current&&!busy&&!listBusy){delete pending[current.id];store('filamentPendingV1',pending);message('saveStatus','フォームの回答 1の確認済みとして、更新を再開しました。');controls()}};
async function refresh(){if(busy||listBusy)return;listBusy=true;controls();let listError='';try{await loadList()}catch(error){listError=error.message;message('listStatus','在庫一覧の再取得に失敗：'+listError+' 前回の表示がある場合は古い情報です。',true)}finally{listBusy=false;controls()}if(current){const id=current.id,selected=selectedFilters();await selectItem(id,selected)}else if(!listError)message('status','QRを読み取ってください。')}
$('refresh').onclick=refresh;
function stopCamera(){cameraEpoch++;if(timer)clearTimeout(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').pause();$('video').srcObject=null;$('camera').hidden=true;$('main').hidden=false;$('scan').disabled=busy||listBusy}
async function startCamera(){if(busy||listBusy)return;if(typeof jsQR==='undefined'){message('status','QR読取ライブラリを取得できません。ページを再読込してください。',true);return}if(!navigator.mediaDevices?.getUserMedia){message('status','HTTPSで開き、カメラが使える端末でお試しください。',true);return}const epoch=++cameraEpoch;$('camera').hidden=false;$('main').hidden=true;try{const acquired=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(epoch!==cameraEpoch){acquired.getTracks().forEach(t=>t.stop());return}stream=acquired;$('video').srcObject=stream;await $('video').play();if(epoch===cameraEpoch)scanFrame(epoch)}catch(error){if(epoch===cameraEpoch){stopCamera();message('status','カメラを起動できません。カメラの使用許可を確認してください。',true)}}}
function scanFrame(epoch){if(epoch!==cameraEpoch||!stream)return;try{const video=$('video');if(video.readyState>=2&&video.videoWidth){const canvas=$('canvas'),scale=Math.min(1,960/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(video,0,0,canvas.width,canvas.height);const image=ctx.getImageData(0,0,canvas.width,canvas.height),code=jsQR(image.data,image.width,image.height);if(code?.data){const id=parseId(code.data);stopCamera();if(id){selectItem(id)}else{current=null;$('itemPanel').hidden=$('stockPanel').hidden=true;message('status','管理番号を含むQRではありません。読み直してください。',true)}return}}timer=setTimeout(()=>scanFrame(epoch),300)}catch(error){stopCamera();message('status','QRを読み取れませんでした。もう一度カメラを起動してください。',true)}}
$('scan').onclick=startCamera;$('cameraClose').onclick=()=>{stopCamera();message('status','カメラを閉じました。')};window.addEventListener('pagehide',stopCamera);document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream)stopCamera()});
async function boot(){listBusy=true;controls();try{await loadList();message('status','QRを読み取ってください。')}catch(error){message('listStatus',error.message+' QRによる1件取得は利用できます。',true);message('status','QRを読み取ってください。')}finally{listBusy=false;controls()}const saved=stored('filamentLastV1',null),id=parseId(location.href)||saved?.id;if(id)await selectItem(id,saved?.id===id?saved.filters:null)}
boot();
</script>

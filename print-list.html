<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#126b58"><title>QRラベル印刷候補</title><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="icon" href="./favicon.ico"><link rel="stylesheet" href="./registration.css"><style>
.wrap{max-width:880px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.candidate{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(100px,.8fr) minmax(90px,.7fr);gap:10px;align-items:center;padding:13px 4px;border-top:1px solid #e0e8e4}.candidate>input{width:22px;height:22px;min-height:0;accent-color:#126b58}.candidate.selected{background:#e9f5ef}.candidate-main{overflow-wrap:anywhere}.candidate-id{font-weight:650}.candidate-sub,.candidate-meta{font-size:13px;color:#546961;overflow-wrap:anywhere}.candidate-print{font-size:13px}.annotation{grid-column:2/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.annotation label{font-size:12px;color:#546961}.annotation input{margin-top:3px;min-height:42px}.annotation button{min-height:42px;white-space:nowrap}.selection-bar{margin-top:16px;padding-top:14px;border-top:1px solid #e0e8e4}.selected-ids{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.selected-ids button{font-size:13px;min-height:40px;padding:7px 9px}@media(max-width:600px){.filters{grid-template-columns:1fr}.candidate{grid-template-columns:28px minmax(0,1fr)}.candidate-meta,.candidate-print{grid-column:2}.annotation{grid-column:2;grid-template-columns:1fr}.annotation button{width:100%}}
</style></head><body><main class="wrap"><header><a href="./index.html">← 窓口へ戻る</a><h1>ラベル印刷</h1><p class="muted">残量がある在庫から、QRを印刷するものを選びます。</p></header>
<section class="panel"><div class="filters"><div><label class="field" for="place">保管場所</label><select id="place"><option value="">すべて</option><option>さんらいず</option><option>オーシャン</option><option>フォージー</option></select></div><div><label class="field" for="maker">メーカー</label><select id="maker" disabled><option value="">すべて</option></select></div><div><label class="field" for="printState">印刷状況</label><select id="printState"><option value="all">すべて（未印刷を先頭）</option><option value="pending">0回・未印刷のみ</option><option value="printed">再印刷（1回以上・過去分）</option></select></div></div>
<p id="status" class="status" role="status" aria-live="polite">在庫データを取得しています…</p><p class="muted">ラベル注釈は自由に書き換えて、そのまま今回のQRに使えます。次回も残したい場合だけ「注釈を保存」を押してください。在庫の内容やフォーム履歴には影響しません。</p><div class="row"><label><input id="selectAll" type="checkbox" style="width:22px;min-height:22px"> 表示中をすべて選ぶ</label><span id="visibleCount" class="muted"></span></div><div id="candidates"></div>
<div class="selection-bar"><div class="row"><strong id="selectedCount">0件選択</strong><button id="clear" type="button">選択を解除</button></div><div id="selectedIds" class="selected-ids"></div><p class="muted">絞り込みを変えても選択は残ります。最大20件まで選べます。</p><button id="preview" class="primary full" type="button" disabled>選んだQRのプレビューへ</button></div></section>
<a class="button full" href="./qr.html">管理番号を直接指定して作成・再印刷</a>
</main><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><script src="./registration-common.js"></script><script src="./print-list.js"></script></body></html>
